name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # ── CI browser settings ──────────────────────────────────────────────
      HEADED: "false"
      SLOW_MO: "0"
      # ── Test credentials (override via repo Secrets if needed) ───────────
      TEST_EMAIL: ${{ secrets.TEST_EMAIL || 'testuser@teebay.com' }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || '123456' }}

    steps:
      # ── 1. Checkout repo (contains both app source and automation scripts) ─
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js + Yarn cache ─────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"

      # ── 3. Install app dependencies ─────────────────────────────────────────
      - name: Install app dependencies
        run: yarn install --frozen-lockfile

      # ── 4. Build the React app ──────────────────────────────────────────────
      - name: Build app
        timeout-minutes: 15
        env:
          CI: "false"   # prevent react-scripts treating warnings as errors
        run: yarn build

      # ── 5. Serve the built app in the background ────────────────────────────
      - name: Serve built app on port 3000
        run: npx --yes serve -s build -l 3000 &

      # ── 6. Wait for the app to be ready ─────────────────────────────────────
      - name: Wait for app on port 3000
        run: npx --yes wait-on http://localhost:3000 --timeout 120000

      # ── 6. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 7. Install Python / Playwright dependencies ─────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 8. Install Playwright browser + OS-level system dependencies ─────────
      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      # ── 9. Run tests ────────────────────────────────────────────────────────
      - name: Run Playwright tests
        run: pytest --browser chromium

      # ── 10. Upload reports (always, even on failure) ─────────────────────────
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-html
          path: reports/report.html
          retention-days: 14

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-json
          path: reports/report.json
          retention-days: 14
